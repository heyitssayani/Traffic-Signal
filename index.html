<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Signal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="title">TRAFFIC SIGNAL</h1>

    <div class="signal">
        <div class="light red" id="red"></div>
        <div class="light yellow" id="yellow"></div>
        <div class="light green" id="green"></div>
    </div>

    <div class="buttons">
        <button onclick="showRed()">Red</button>
        <button onclick="showYellow()">Yellow</button>
        <button onclick="showGreen()">Green</button>
    </div>

    <script src="new.js"></script>

</body>
</html>
